name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of this workflow for the same ref. Saves CI minutes
# when a branch is updated rapidly during iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    # Hard ceiling so a hung JAX compile / runaway test can't burn the day.
    # The suite trains small JAX models. Shared-runner speed varies by more than 2x
    # between otherwise identical runs (either Python version can draw the slow
    # machine), so the suite runs in parallel and the ceiling keeps headroom.
    timeout-minutes: 35
    strategy:
      # Report failures from every Python version even if one fails first.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Built-in pip cache keyed on the resolved dependency set.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build native kernels
        run: make -C native

      - name: Show environment
        run: |
          python --version
          lscpu
          pip list

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        # -q for compactness; --durations surfaces slow tests when CI feels sluggish.
        run: |
          # Native kernels are built above, so workers never race on the import-time build.
          pytest -q -n auto --dist worksteal --durations=10 --cov=src/hybrid_alife --cov-report=term-missing --cov-fail-under=85

  sanitizers:
    # Native kernels under AddressSanitizer and UndefinedBehaviorSanitizer.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build instrumented native kernels
        run: make sanitize-build

      - name: Test native kernels under sanitizers
        run: make sanitize-test
