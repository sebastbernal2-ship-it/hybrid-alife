<!doctype html><meta charset="utf-8"><title>Creature design stills</title>
<style>html,body{margin:0;background:#03051c}svg{display:block}</style>
<body><script>
"use strict";
/* Facing +x, body half-length ~100 units. All shapes are generated from the parameters. */
const hsl=(h,s,l,a=1)=>`hsla(${h},${s}%,${l}%,${a})`;
function pal(h,s=1){return{rim:hsl(h,90*s,89),pale:hsl(h,85*s,81),base:hsl(h,80*s,69),shade:hsl(h,66*s,52),core:hsl(h,88*s,31),deep:hsl(h,90*s,18),mid:hsl(h,92*s,42)}}
let uid=0;
const f=n=>n.toFixed(1);
/* closed Catmull-Rom; a point with third value 1 is a sharp corner */
function blob(p){const n=p.length;let d=`M${f(p[0][0])} ${f(p[0][1])}`;
 for(let i=0;i<n;i++){const a=p[(i-1+n)%n],b=p[i],c=p[(i+1)%n],e=p[(i+2)%n];
  const k1=b[2]?0:1/6,k2=c[2]?0:1/6;
  d+=`C${f(b[0]+(c[0]-a[0])*k1)} ${f(b[1]+(c[1]-a[1])*k1)} ${f(c[0]-(e[0]-b[0])*k2)} ${f(c[1]-(e[1]-b[1])*k2)} ${f(c[0])} ${f(c[1])}`}
 return d+'Z'}
const mirror=(p,s)=>p.map(q=>[q[0],q[1]*s,q[2]]);
const path=(d,fill,stroke,w,extra='')=>`<path d="${d}" fill="${fill}" stroke="${stroke||'none'}" stroke-width="${w||0}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const ell=(x,y,rx,ry,fill,rot=0,extra='')=>`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" fill="${fill}" transform="rotate(${f(rot)} ${f(x)} ${f(y)})" ${extra}/>`;
/* cel-shaded plate: shade fill, lit copy shifted toward the midline-front, thick pale rim */
function plate(d,P,w,dx,dy,fill=P.base,lit=true,op=1){const id='c'+(uid++);
 return `<clipPath id="${id}"><path d="${d}"/></clipPath><g opacity="${op}">${path(d,lit?P.shade:fill)}${lit?`<g clip-path="url(#${id})">${path(d,fill,null,0,`transform="translate(${f(dx)} ${f(dy)})"`)}</g>`:''}</g>${path(d,'none',P.rim,w)}`}
/* glossy blob: bean + dot */
function gloss(x,y,rx,ry,rot,col='#fff',dot=true){const c=Math.cos(rot*Math.PI/180),s=Math.sin(rot*Math.PI/180);
 return ell(x,y,rx,ry,col,rot)+(dot?ell(x-c*(rx+ry*.75),y-s*(rx+ry*.75),ry*.42,ry*.42,col):'')}
function eye(x,y,r,rot,h){const o=hsl(h,95,74),i=hsl(h,80,48),k=hsl(h,85,33);
 return `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rot)})">`+ell(0,0,r*1.18,r*.94,o,0,`stroke="${hsl(h,95,84)}" stroke-width="${f(r*.2)}"`)
 +ell(r*.17,0,r*.78,r*.62,i)+ell(r*.3,0,r*.42,r*.36,k)+ell(-r*.2,-r*.25,r*.36,r*.2,'#fff',-22)+ell(r*.5,r*.26,r*.12,r*.1,'#fff')+`</g>`}

function creature(g){
 const P=pal(g.hue,g.sat??1), L=100*g.len, W=62*g.wid, w=g.rim??8.5;
 let o='';
 /* whiskers: thin, paired, S-curved, trailing */
 for(let k=0;k<g.whisk;k++)for(const s of[-1,1]){
  const Lw=g.wlen*(1-.3*k)*(s<0?1:.9), x0=k?-L*.55:g.wfront?L*.45:-L*.3, y0=s*W*(k?.35:g.wfront?.72:.6), sp=s*(W*(g.wspread??.75)+k*8);
  const d=`M${x0} ${y0}C${f(x0-Lw*.15)} ${f(y0+sp*.85)} ${f(x0-Lw*.55)} ${f(y0+sp*.8)} ${f(x0-Lw*.8)} ${f(y0+sp*.35)}S${f(x0-Lw*1.12)} ${f(y0+sp*(g.curl??.15)+s*(s<0?14:-4))} ${f(x0-Lw*1.22)} ${f(y0+sp*.55)}`;
  o+=path(d,'none',P.base,w*.82)+path(d,'none',P.pale,w*.4)}
 /* rear fins */
 const tx=-L*.72;
 if(g.fin==='frill'){const pts=[[tx+35,-W*.5]],n=g.frills??4;
  for(let i=0;i<n;i++){const t=(i+.5)/n*2-1,t2=(i+1)/n*2-1,r=g.finlen*(1-.25*t*t);
   pts.push([tx-r*.55,t*W*.82-9],[tx-r*.98,t*W*.98-4],[tx-r*.93,t*W*.98+8],[tx-r*.56,t*W*.8+10]);if(i<n-1)pts.push([tx-r*.2,t2*W*.55,1])}
  pts.push([tx+35,W*.5]);o+=plate(blob(pts),P,w*.85,6,0,P.pale)}
 if(g.fin==='fork'||g.fin==='sweep')for(const s of[-1,1]){const l=g.finlen*(s<0?1:.9);
  o+=plate(blob(mirror([[tx+45,4],[tx+30,W*.55],[tx-l*.3,W*.62],[tx-l*1.05,W*(g.fin==='fork'?.95:.3),1],[tx-l*.55,W*.34],[tx-l*.45,W*.1],[tx,2]],s)),P,w*.9,5,-s*8,P.pale)}
 if(g.fin==='fan'){const pts=[[tx+30,-18]];for(let i=0;i<=5;i++){const a=(i/5-.5)*2.1;pts.push([tx-Math.cos(a)*g.finlen,Math.sin(a)*g.finlen*1.05]);if(i<5){const b=((i+.5)/5-.5)*2.1;pts.push([tx-Math.cos(b)*g.finlen*.74,Math.sin(b)*g.finlen*.76,1])}}
  pts.push([tx+30,18]);o+=plate(blob(pts),P,w*.85,8,0,P.pale);
  for(let i=1;i<5;i++){const a=(i/5-.5)*2.1;o+=path(`M${tx} 0L${f(tx-Math.cos(a)*g.finlen*.7)} ${f(Math.sin(a)*g.finlen*.73)}`,'none',P.shade,w*.5)}}
 /* side wings (manta-like) */
 if(g.wing)for(const s of[-1,1])o+=plate(blob(mirror([[L*.45,W*.4],[L*.12,W*.95],[-L*.3,W*(1+g.wing)],[-L*1.02,W*(1.08+g.wing),1],[-L*.62,W*.82],[-L*.66,W*.6],[-L*.4,W*.52],[-L*.35,W*.15]],s)),P,w,5,-s*13,P.base);
 /* limb paddles */
 for(let k=0;k<(g.legs||0);k++)for(const s of[-1,1]){const x=L*(.3-k*.38);
  o+=plate(blob(mirror([[x+14,W*.6],[x+4,W*1.12],[x-34,W*1.38,1],[x-20,W*1.02],[x-22,W*.58]],s)),P,w*.8,4,-s*7,P.pale)}
 /* dorsal spines */
 for(let k=0;k<(g.spikes||0);k++)for(const s of[-1,1]){const a=(38+k*92/(g.spikes-1))*Math.PI/180,c=Math.cos(a),n=Math.sin(a)*s,pt=(r,da)=>[Math.cos(a+da)*L*.8*r-6,Math.sin(a+da)*W*.86*r*s,da===0&&r>1.2?1:0];
  o+=plate(blob([pt(.8,-.2),pt(1.08,-.09),pt(g.lobe?1.78:1.68,0),pt(1.08,.14),pt(.8,.22)]),P,w*.8,3,-s*4,P.rim)}
 /* translucent dark core */
 const core=blob([[L*.82,0],[L*.56,-W*.67],[L*.05,-W*.8],[-L*.5,-W*.62],[-L*.9,-W*.12],[-L*.9,W*.12],[-L*.5,W*.62],[L*.05,W*.8],[L*.56,W*.67]]);
 o+=plate(core,P,w,0,0,P.core,false,.94);
 o+=ell(-L*.06,0,L*.46,W*.5,P.mid)+ell(L*.02,0,L*.34,W*.37,P.deep)+ell(-L*.36,W*.2,L*.12,W*.14,P.base,0,'opacity=".75"')+ell(-L*.47,-W*.12,L*.06,W*.08,P.mid)+ell(L*.24,-W*.22,L*.055,W*.07,P.mid);
 o+=path(`M${L*.36} ${W*.5}Q${-L*.05} ${W*.72} ${-L*.45} ${W*.46}`,'none',P.mid,w*.8);
 /* abdomen */
 if(g.abd){const a=g.abd;
  o+=plate(blob([[-L*.3,0],[-L*.45,-W*.55*a],[-L*.85,-W*.5*a],[-L*1.18,-W*.18*a],[-L*1.34,0,g.point?1:0],[-L*1.18,W*.18*a],[-L*.85,W*.5*a],[-L*.45,W*.55*a]]),P,w,9,-8);
  o+=gloss(-L*.78,-W*.24*a,L*.17,W*.1*a,12,P.rim)}
 /* segmented armour bands */
 for(let k=(g.segs||0)-1;k>=0;k--){const x=L*(.18-k*.36),r=W*(.86-.13*k),t=L*.2;
  o+=plate(blob([[x+t*1.2,0],[x+t*.65,-r*.8],[x-t*.15,-r*1.03],[x-t*.85,-r*.86],[x-t*.35,-r*.4],[x-t*.2,0],[x-t*.35,r*.4],[x-t*.85,r*.86],[x-t*.15,r*1.03],[x+t*.65,r*.8]]),P,w*.85,6,-7);
  o+=gloss(x+t*.35,-r*.48,r*.17,r*.09,66,P.rim,false)}
 /* the two big side plates (elytra), asymmetric sheen */
 if(g.lobe)for(const s of[1,-1]){const q=g.lobe,gap=g.gap??.4,tip=g.tip??0;
  const back=g.longlobe?1:.78;
  o+=plate(blob(mirror([[L*.58,W*gap],[L*.45,W*.78],[L*.05,W*(.84+.2*q)],[-L*.45*back,W*(.72+.18*q)],[-L*(.8+.2*tip)*back,W*(.42-.18*tip),tip>=1?1:0],[-L*.46*back,W*(gap-.06)],[-L*.1,W*(gap+.14*(1-q))],[L*.3,W*gap*.9]],s)),P,w,5,-s*12);
  o+=gloss(-L*.02,s*W*(.66+.11*q),L*.2,W*.11,s*8,s<0?P.rim:P.pale,true)}
 /* head dome */
 if(g.head){const h=g.head,hx=L*(g.headx??.5);
  o+=plate(blob([[hx+L*.4*h,0],[hx+L*.27*h,-W*.48*h],[hx-L*.06*h,-W*.6*h],[hx-L*.34*h,-W*.38*h],[hx-L*.4*h,0],[hx-L*.34*h,W*.38*h],[hx-L*.06*h,W*.6*h],[hx+L*.27*h,W*.48*h]]),P,w,7,-11,P.pale);
  o+=gloss(hx+L*.03,-W*.22*h,L*.2*h,W*.19*h,18,P.rim)+ell(hx-L*.2*h,W*.24*h,L*.045,W*.06,P.rim)}
 else o+=gloss(L*.2,-W*.34,L*.2,W*.14,12,P.rim);
 if(g.shell)for(const s of[-1,1]){o+=plate(blob(mirror([[L*.5,W*.3],[L*.25,W*.66],[-L*.3,W*.66],[-L*.68,W*.18,1],[-L*.28,W*.42],[L*.15,W*.44]],s)),P,w*.75,4,-s*7);o+=gloss(-L*.02,s*W*.56,L*.13,W*.06,s*6,P.rim)}
 /* mouth parts */
 if(g.jaw==='pincer')for(const s of[-1,1]){const j=g.jawlen;
  o+=plate(blob(mirror([[L*.52,W*.5],[L*.78+j*.3,W*1.02],[L*.9+j*.85,W*.95],[L*.98+j*1.12,W*.5],[L*.92+j*1.12,W*.1,1],[L*.91+j*.86,W*.42,1],[L*.8+j*.76,W*.27,1],[L*.83+j*.62,W*.55,1],[L*.76+j*.45,W*.36,1],[L*.77+j*.3,W*.62,1],[L*.66,W*.18]],s)),P,w*.85,4,-s*9,P.pale)}
 if(g.jaw==='mandible')for(const s of[-1,1]){const j=g.jawlen,d=mirror([[L*.64,W*.36],[L*.8+j*.4,W*.78],[L*.84+j*.9,W*.66],[L*.82+j*1.15,W*.22,1],[L*.82+j*.8,W*.42],[L*.8+j*.68,W*.22,1],[L*.78+j*.5,W*.43],[L*.72,W*.14]],s);
  o+=plate(blob(d),P,w*.75,3,-s*5,P.pale)}
 if(g.jaw==='tusk')for(const s of[-1,1])o+=plate(blob(mirror([[L*.72,W*.12],[L*.92+g.jawlen,W*.24,1],[L*.68,W*.42]],s)),P,w*.65,0,0,P.rim,false);
 if(g.feel)for(const s of[-1,1]){const d=`M${L*.76} ${s*W*.2}C${L+25} ${s*W*.18} ${L+g.feel*.6} ${s*W*.95} ${L+g.feel} ${s*W*.65}`;
  o+=path(d,'none',P.pale,w*.55)+ell(L+g.feel,s*W*.65,w*.75,w*.75,P.rim)}
 if(g.lure){const d=`M${L*.62} 0C${L*1.05} ${-W*.1} ${L*1.2} ${-W*1.35} ${L*1.52} ${-W*.7}`,x=L*1.52,y=-W*.62;
  o+=path(d,'none',P.rim,w*.8)+ell(x,y,27,27,'#ffe45c',0,'opacity=".18"')+ell(x,y,17,17,'#ffd426',0,'stroke="#fff6b8" stroke-width="6"')+ell(x-5,y-6,6,4,'#fff',-35)}
 /* grin */
 if(g.grin){const x=L*.68,h=W*.5;
  o+=plate(blob([[x+4,-h],[x+30,-h*.62],[x+42,0],[x+30,h*.62],[x+4,h],[x+10,0]]),P,w*.9,0,0,P.deep,false);
  for(const t of[-.58,-.2,.2,.58]){const y=t*h,xx=x+37-18*t*t;o+=path(blob([[xx+1,y-8,1],[xx-17,y,1],[xx+1,y+8,1]]),'#fff',P.rim,2.5)}}
 /* eyes: front, on the sides, breaking the silhouette */
 const er=g.eye,ex=L*(g.eyex??.52),ey=W*(g.eyey??.69);
 o+=eye(ex,-ey,er,-17,g.eyehue)+eye(ex,ey*.98,er*.94,17,g.eyehue);
 for(let k=0;k<(g.ocelli||0);k++)for(const s of[-1,1])o+=eye(ex-er*(1.65+k*1.2),s*ey*(1.02-k*.04),er*(.45-.1*k),s*22,g.eyehue);
 return o}

/* aspect and size are the two real body genes; everything else here is illustrative */
const SPECIES={
 grazer:{name:'Dewling',headx:.6,size:.95,aspect:1,hue:96,eyehue:30,len:.8,wid:1.08,lobe:.7,gap:.46,head:.68,abd:.6,fin:'frill',finlen:50,frills:3,whisk:1,wlen:125,eye:20},
 reaver:{name:'Reaver',size:1.45,aspect:1.2,hue:12,eyehue:82,len:1.14,wid:1.06,lobe:.65,tip:.15,gap:.36,longlobe:1,head:.92,headx:.32,abd:1.12,point:1,fin:'sweep',finlen:64,whisk:1,wlen:165,jaw:'pincer',jawlen:66,eye:18,eyex:.55,eyey:.78,rim:9},
 ray:{name:'Veil ray',size:1.3,aspect:.82,hue:255,sat:.6,eyehue:44,len:.85,wid:1.08,wing:.5,lobe:.45,gap:.5,head:.7,headx:.62,abd:.5,fin:'frill',finlen:62,frills:5,whisk:2,wlen:230,wfront:true,wspread:1.25,eye:19},
 darter:{name:'Needle darter',size:.8,aspect:1.4,hue:218,sat:.2,eyehue:350,len:1.2,wid:.76,rim:7,longlobe:1,lobe:.45,gap:.42,tip:.15,head:.9,headx:.42,abd:.9,point:1,fin:'fork',finlen:100,whisk:1,wlen:120,wspread:1.1,jaw:'tusk',jawlen:28,eye:19,eyey:.9},
 puff:{name:'Bellpuff',size:1.05,aspect:.7,hue:200,eyehue:14,len:.74,wid:1.18,lobe:1,gap:.4,head:.72,headx:.2,fin:'fan',finlen:78,whisk:1,wlen:150,curl:-.5,eye:23,eyex:.62,eyey:.66},
 woodlouse:{name:'Plated crawler',size:1.15,aspect:1.15,hue:28,eyehue:171,len:1.15,wid:.82,segs:3,head:.82,headx:.6,abd:.66,fin:'fan',finlen:48,legs:3,whisk:0,feel:75,eye:16,eyex:.66,eyey:.76},
 bur:{name:'Thornback',size:1.1,aspect:.95,hue:48,eyehue:262,len:.92,wid:.9,spikes:5,shell:1,lobe:0,head:.7,headx:.52,abd:0,fin:'none',whisk:1,wlen:105,jaw:'mandible',jawlen:34,eye:17},
 hatch:{name:'Hatchling',size:.6,aspect:.9,hue:184,eyehue:300,len:.62,wid:.88,lobe:0,head:1.05,headx:.28,fin:'frill',finlen:42,frills:3,whisk:1,wlen:95,eye:29,eyex:.62,eyey:.78,rim:10},
 angler:{name:'Lantern gulper',size:1.2,aspect:.78,hue:268,sat:.8,eyehue:92,len:.82,wid:1.1,lobe:.35,gap:.5,head:.82,headx:.2,abd:0,fin:'fork',finlen:48,legs:1,whisk:0,lure:1,grin:1,eye:21,eyex:.5,eyey:.8,ocelli:1},
 comet:{name:'Streamer',size:.9,aspect:1.3,hue:164,eyehue:45,len:1.04,wid:.76,lobe:.7,gap:.34,tip:0,abd:.8,head:.78,fin:'frill',finlen:92,frills:2,whisk:2,wlen:250,wspread:.65,feel:42,eye:18,eyey:.86}
};
/* sprite: size scales uniformly, aspect stretches the body plan (eyes stay round-ish) */
function sprite(g,x,y,k,rot){const sc=k*g.size, stretch=Math.sqrt(g.aspect);
 const q={...g,rim:(g.rim??8.5)*Math.max(1,Math.min(1.35,.7/sc)),len:g.len*stretch/Math.sqrt(g.refAspect??g.aspect),wid:g.wid/stretch*Math.sqrt(g.refAspect??g.aspect)};
 return `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rot)}) scale(${sc.toFixed(3)})">${creature(q)}</g>`}
function food(x,y,r){return ell(x,y,r*1.06,r,'#adff79',-12,`stroke="#e3ffd2" stroke-width="${f(r*.14)}"`)
 +ell(x+r*.02,y+r*.04,r*.8,r*.74,'#10ae0c',-12)+ell(x-r*.06,y-r*.06,r*.67,r*.58,'#18e30e',-18)+ell(x,y+r*.02,r*.3,r*.3,'#08720a')
 +ell(x-r*.28,y-r*.47,r*.33,r*.17,'#d9ffc4',-27)+ell(x+r*.46,y+r*.36,r*.27,r*.13,'#c4ffa8',-48)+ell(x-r*.55,y+r*.02,r*.1,r*.1,'#d9ffc4')}
function backdrop(W,H,list){let o=`<rect width="${W}" height="${H}" fill="#02041c"/>`;
 for(const[x,y,r,t]of list)o+=ell(x*W,y*H,r,r,['#0c1239','#121845','#2a3b86'][t]);return o}
const svg=(W,H,b)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${b}</svg>`;
const BG=[[.1,.2,170,0],[.27,.17,45,0],[.22,.66,200,0],[.52,.55,340,1],[.82,.3,225,1],[.47,.45,150,2],[.62,.62,175,2],[.35,.16,42,2],[.8,.77,125,2],[.27,.83,70,2],[.9,.11,42,0],[.08,.86,42,0],[.95,.62,13,2],[.69,.14,58,2]];

function sheet(){const W=2000,H=1200;let o=backdrop(W,H,BG.map(c=>[c[0],c[1],c[2]*.75,c[3]===2?1:0]));
 const order=['grazer','reaver','ray','darter','puff','woodlouse','bur','hatch','angler','comet'];
 order.forEach((n,i)=>{const g=SPECIES[n],cx=(i%5)*400+200,cy=Math.floor(i/5)*470+235;
  const off={grazer:30,reaver:5,ray:55,darter:35,puff:50,woodlouse:5,bur:20,hatch:25,angler:-5,comet:75}[n];
  const k={reaver:.78,ray:.9,comet:.8,darter:1.08,woodlouse:.95}[n]??1.05;
  o+=sprite(g,cx+off,cy,k,-14);
  o+=`<text x="${cx}" y="${cy+210}" fill="#fff" font="" font-family="Arial Narrow,Arial,sans-serif" font-size="23" text-anchor="middle">${g.name.toUpperCase()}</text><text x="${cx}" y="${cy+234}" fill="#8f9bd0" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">size ${g.size.toFixed(2)} · aspect ${g.aspect.toFixed(2)}</text>`});
 [[110,1085,46],[250,1097,32],[360,1083,21],[440,1100,13]].forEach(a=>o+=food(...a));
 /* the two real genes on one body plan, across their full clip ranges */
 [[.6,.7],[.6,1.4],[1.2,1],[1.8,.7],[1.8,1.4]].forEach(([s,a],i)=>{const x=[660,870,1120,1420,1780][i];
  o+=sprite({...SPECIES.grazer,size:s,aspect:a,refAspect:1},x,1062,.46,-8)+`<text x="${x}" y="1175" fill="#8f9bd0" font-family="Arial" font-size="15" text-anchor="middle">size ${s} / aspect ${a}</text>`});
 return svg(W,H,o)}

function scene(){const W=1600,H=900;let o=backdrop(W,H,BG);
 for(const a of[[120,455,40],[395,75,19],[560,800,36],[925,95,31],[1475,330,54],[1525,95,20],[1040,520,16],[735,330,13],[60,150,14],[1210,850,23],[300,610,12],[1130,455,17],[895,575,14]])o+=food(...a);
 /* name, x, y, scale, heading deg */
 const C=[['darter',165,95,.5,172],['puff',250,230,.62,196],['grazer',650,150,.48,18],['hatch',775,130,.55,8],['hatch',850,185,.43,-6],['woodlouse',1095,68,.4,181],['ray',1180,215,.82,168],['comet',555,320,.56,-163],['woodlouse',215,730,.58,-12],['bur',390,430,.55,24],['grazer',895,745,.55,-6],['grazer',760,665,.46,14],['grazer',735,830,.4,-16],['grazer',625,505,.4,32],['reaver',1225,715,.8,168],['angler',1360,495,.55,-142],['darter',955,350,.48,-24],['puff',1455,825,.38,-110],['comet',380,845,.46,12],['grazer',1065,385,.5,158],['hatch',1120,590,.5,24]];
 for(const[n,x,y,k,r]of C){let g=SPECIES[n];
  /* keep lighting on top for left-facing creatures by mirroring */
  const flip=Math.abs(r)>90;
  const s=sprite(g,0,0,k,0);
  o+=`<g transform="translate(${x} ${y}) rotate(${r}) scale(1 ${flip?-1:1})">${s}</g>`}
 for(const[x,y,r]of[[1040,775,9],[1010,790,5],[1068,762,4],[470,330,7],[490,347,4]])o+=ell(x,y,r,r,'#26356f',0,'stroke="#59679a" stroke-width="2.5"');
 return svg(W,H,o)}
